# =====================================================================
# Estado apos a AULA 4 (criptografia + sessao).
# Corrigido: AES-GCM (chave em config/env), JWT verificado, cookie seguro.
# AINDA vulneravel: error.* verboso (Aula 5), Actuator/H2 abertos (Aula 6).
# =====================================================================
spring:
  application:
    name: portal-pedidos
  profiles:
    active: h2

  datasource:
    url: jdbc:h2:mem:portal;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
    show-sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  # A05 - ainda habilitado (corrigido na Aula 6)
  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  servlet:
    session:
      cookie:
        # Lab 4.3 - flags de seguranca do cookie
        http-only: true
        secure: false        # DEV ONLY (sem HTTPS local)
        same-site: lax
      timeout: 15m
  error:
    # A05/A09 - ainda verboso (corrigido na Aula 5)
    include-message: always
    include-stacktrace: always
    include-exception: true

# A05 - Actuator ainda totalmente exposto (corrigido na Aula 6)
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    env:
      show-values: always

portal:
  jwt:
    # Lab 4.2 - chave Base64 (>=32 bytes). Override: PORTAL_JWT_SECRET
    secret: ${PORTAL_JWT_SECRET:AyjpJmIAw5EyzdygA5Ydd2vm8pp5Sqed7wDAk6MFKbY=}
    expiration-ms: 900000
  crypto:
    # Lab 4.1 - chave Base64 de 32 bytes (AES-256). Override: PORTAL_CRYPTO_KEY
    key: ${PORTAL_CRYPTO_KEY:cMlQRds5K9r42D8FYoxCQhM/vdyxStTh1Ew+OsG9Gjs=}
  upload:
    dir: ./uploads

logging:
  level:
    com.thrive.portal: INFO
