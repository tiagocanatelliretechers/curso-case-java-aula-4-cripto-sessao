<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Entrar - Portal B2B</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header><strong>Portal de Pedidos B2B</strong><nav><a th:href="@{/}">Inicio</a></nav></header>
<main>
    <div class="card" style="max-width:420px;margin:0 auto;">
        <h1>Entrar</h1>
        <div class="msg" th:if="${mensagem}" th:text="${mensagem}"></div>
        <div class="err" th:if="${param.error}">Credenciais invalidas.</div>
        <div class="msg" th:if="${param.logout}">Voce saiu com sucesso.</div>
        <form th:action="@{/login}" method="post">
            <label>E-mail</label>
            <input type="text" name="username" style="width:100%" autofocus/>
            <label>Senha</label>
            <input type="password" name="password" style="width:100%"/>
            <p><button type="submit" style="width:100%">Entrar</button></p>
        </form>
        <p><a th:href="@{/registrar}">Cadastrar</a> &middot; <a th:href="@{/esqueci-senha}">Esqueci minha senha</a></p>
        <p class="warn">Contas de teste: admin@portal.com / admin123 &nbsp;|&nbsp; joao@acme.com / senha123</p>
    </div>
</main>
</body>
</html>
